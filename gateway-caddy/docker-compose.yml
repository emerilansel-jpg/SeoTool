# Dedicated Caddy for seotool.im — separated from pesat-control-plane.
# Cloud provider firewall only allows 80/443 (owned by pesat-caddy), so this
# container is internal-only: pesat-caddy forwards seotool.im traffic to it
# over the shared docker network. No host port bindings.
#
# Usage:
#   docker compose -f gateway-caddy/docker-compose.yml up -d
#
services:
  seotool-caddy:
    image: caddy:2-alpine
    container_name: seotool-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile.seotool:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Marketing static files — populated via: docker cp web/dist/client/. seotool-caddy:/srv/marketing/
      - marketing_files:/srv/marketing
    networks:
      - seotool_net

networks:
  seotool_net:
    name: jetdigitalseo_default
    external: true

volumes:
  caddy_data:
  caddy_config:
  marketing_files:
