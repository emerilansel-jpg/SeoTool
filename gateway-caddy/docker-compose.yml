# Dedicated Caddy for seotool.im — separated from pesat-control-plane.
# pesat-caddy runs in HOST network mode and owns public 80/443. This container
# binds 127.0.0.1:8080 only (not reachable externally, no cloud-firewall
# dependency); pesat-caddy forwards seotool.im traffic to 127.0.0.1:8080.
#
# Usage:
#   docker compose -f gateway-caddy/docker-compose.yml up -d
#
services:
  seotool-caddy:
    image: caddy:2-alpine
    container_name: seotool-caddy
    restart: unless-stopped
    ports:
      # Localhost only — pesat-caddy (host network) proxies to this
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile.seotool:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Marketing static files — populated via: docker cp web/dist/client/. seotool-caddy:/srv/marketing/
      - marketing_files:/srv/marketing
    networks:
      - seotool_net

networks:
  seotool_net:
    name: jetdigitalseo_default
    external: true

volumes:
  caddy_data:
  caddy_config:
  marketing_files:
