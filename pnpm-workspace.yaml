# Advisories triaged as not applicable. Re-review when the parent updates.
# - GHSA-67mh-4wv8-2f99: esbuild <=0.24.2 dev-server CORS. Only reachable via
#   drizzle-kit's bundled @esbuild-kit loader (dev-time CLI); drizzle-kit never
#   starts esbuild's serve mode, so the vulnerable path cannot execute.
auditConfig:
  ignoreGhsas:
    - GHSA-67mh-4wv8-2f99

# Security floors for transitive deps with published advisories where the
# parent hasn't shipped a bump yet.
#
# IMPORTANT: the functional overrides live in package.json (`pnpm.overrides`)
# — empirically pnpm 10.30 re-resolves only the package.json overrides and
# ignores an `overrides:` block here, so keeping floors in both files would
# silently let vulnerable versions back into the lockfile. Ranges there are
# major-bounded (^) on purpose: an override REPLACES the parent's range, so an
# open-ended >= floor would let a future major (e.g. hono 5) get forced onto a
# parent that only supports the current one.
#
# The annotated table (package → floor → GHSA(s) → "waiting on" parent →
# prune condition) lives in docs/SECURITY_OVERRIDES.md. When `pnpm audit`
# flags a new package: bump/add the floor in package.json AND document it in
# that table. To prune once a parent catches up: delete the entry from both
# places, run `pnpm install`, and keep it deleted if `pnpm audit` stays clean.
