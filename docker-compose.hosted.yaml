# Docker Compose for hosted SaaS deployment on a VPS.
#
# This stack runs:
#   - open-seo: the app (workerd in Docker), connected to Postgres
#   - postgres: the database
#
# Caddy is NOT included here. The shared gateway-caddy container (already
# running on this VPS) handles TLS and reverse proxying. See the
# gateway-caddy Caddyfile for the seotool.im routing configuration.
#
# Usage:
#   1. Copy .env.hosted.example to .env.hosted and fill in the values.
#   2. Update the gateway-caddy Caddyfile with the seotool.im site block.
#   3. docker compose -f docker-compose.hosted.yaml --env-file .env.hosted up -d --build

services:
  open-seo:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped
    env_file:
      - .env.hosted
    environment:
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=3001
      - AUTH_MODE=hosted
      - DATABASE_PROVIDER=postgres
      - POSTGRES_DATABASE_URL=postgres://openseo:${POSTGRES_PASSWORD}@postgres:5432/openseo
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - open_seo_data:/app/.wrangler
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openseo
      POSTGRES_USER: openseo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openseo -d openseo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  open_seo_data:
  pg_data:
